[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle every route (e.g. /projects/amah),
# so direct links and refreshes never hit Netlify's own 404 page.
# Real files (images, /og-image.png, /sitemap.xml) are still served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
